# dsh-computers: one Host row that registers the computer registry, the
# agent-facing endpoints, the model-facing tools and the settings page.
#
# role:
#   hub      - this instance only controls machines (the server); no local runtime card
#   runtime  - this instance only exposes itself to a hub (a desktop Mac); no computer list
#   both     - default: both cards; the machine can be controlled AND control others
#
# The default work layout is one server with role: hub and every other machine
# left on the default, connecting out to the server. Topology is hub-and-spoke
# only - a runtime never accepts inbound connections.
- insert:
    - id: dsh-computers
      name: dsh-computers
      config:
        role: both
        publicUrl: ''
        stateDir: ''
        keyTtlMinutes: 15
        heartbeatMs: 20000
        execTimeoutMs: 120000
        execEnabled: true
        promoteOnTimeout: true
        # 中继（v1.6.0，默认关闭）：开启后本机可被任何网络下的机器/手机连到，
        # 不需要公网 IP 或开放端口。详见 docs/relay-deploy.md
        relay:
          enabled: false
          url: ''                 # 例如 wss://relay.example.com（你自己的中继）
          publicUrl: ''           # 留空自动生成 https://<relay>/r/<hubId>
          accessKey: ''
          hubId: ''               # 留空自动生成并持久化到 <stateDir>/relay.json
          name: ''
        # 自动把本机 DSH 通过 tailscale serve 暴露到 tailnet（默认关闭）
        tailscaleServe:
          enabled: false
          httpsPort: 8443
        # auto | public | tailscale | lan | loopback
        preferAddress: auto
        # '' = 不强制版本门（旧 agent 仍可用，只是没有新能力）；填 1.3 这类值才强制拦截
        minAgentVersion: ''
        maxOutputBytes: 1048576
